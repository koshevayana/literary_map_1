{% load static %}
<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="{% url 'home' %}">
      <span class="brand__symbol"><img src="{% static 'img/flag.svg' %}" alt="" width="12" height="18"></span>
      <span class="brand__words">Литературная карта<small>народов России</small></span>
    </a>
    <nav class="site-nav" aria-label="Главная навигация">
      <a href="{% url 'home' %}#map">Карта</a>
      <a href="{% url 'home' %}#authors">Авторы</a>
      <a href="{% url 'home' %}#methodics">Методический конструктор</a>
      <a href="{% url 'home' %}#media">Медиатека</a>
      <a href="{% url 'home' %}#projects-bank">Банк проектов</a>
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ request.get_full_path }}">
          <button class="pill" type="submit">Выйти</button>
        </form>
      {% else %}
        {% with page=request.resolver_match.url_name %}
          <a class="pill" href="{% url 'login' %}{% if page != 'login' and page != 'register' %}?next={{ request.get_full_path|urlencode }}{% endif %}">Войти</a>
        {% endwith %}
      {% endif %}
    </nav>
    <form class="site-search" action="{% url 'search' %}" method="get" role="search">
      <input type="search" name="q" placeholder="Поиск по сайту" value="{{ request.GET.q|default:'' }}" aria-label="Поиск по сайту" required>
      <button type="submit" aria-label="Найти">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </form>
  </div>
</header>
